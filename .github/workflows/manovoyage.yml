# Tient le site manovoyage à jour sur https://kevdubinks.github.io/parking/
#
# GitHub Pages sert la branche `gh-pages`, activée automatiquement lors de son
# premier envoi. Ce workflow y recopie le contenu de manovoyage/ à chaque
# modification, et rien d'autre : l'application parking n'est ni construite ni
# publiée.
#
# `gh-pages` ne contient que du contenu produit — elle n'est pas une branche de
# travail. Les sources vivent sur la branche de développement.

name: Publier manovoyage

on:
  push:
    branches: [claude/manovoyage-travel-blog-nnst89]
    paths:
      - 'manovoyage/**'
      - '.github/workflows/manovoyage.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-manovoyage
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier que le site est complet
        run: |
          set -e
          test -f manovoyage/index.html
          vues=$(find manovoyage/medias -name '*.jpg' -not -path '*vignettes*' | wc -l)
          vign=$(find manovoyage/medias/vignettes -name '*.jpg' | wc -l)
          echo "photos : $vues   vignettes : $vign"
          # Publier un site à trous serait pire que ne rien publier.
          test "$vues" -eq "$vign"
          test "$vues" -gt 0

      - name: Recopier sur gh-pages
        run: |
          set -e
          git config --global user.name  'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages --depth=1
          git worktree add /tmp/site origin/gh-pages
          cd /tmp/site
          git checkout -B gh-pages
          # Remplacer le contenu, pas le compléter : un fichier retiré de la
          # source doit disparaître du site.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$GITHUB_WORKSPACE/manovoyage/." .
          rm -f LISEZMOI.md          # la doc du dépôt n'a rien à faire en ligne
          touch .nojekyll            # ne pas traiter le dossier comme un site Jekyll
          git add -A
          if git diff --cached --quiet; then
            echo "site déjà à jour, rien à publier"
            exit 0
          fi
          git commit -q -m "manovoyage — publication depuis ${GITHUB_SHA:0:7}"
          git push origin gh-pages
          echo "publié : https://kevdubinks.github.io/parking/"
